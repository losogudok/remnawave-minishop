name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running migration/deployment. New pushes queue behind it.
concurrency:
  group: minishop-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  fullstack:
    uses: ./.github/workflows/fullstack-qa.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  deploy:
    needs: [checks, fullstack, security]
    if: github.repository == 'losogudok/remnawave-minishop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Check out tested source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy tested commit over SSH
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: normis
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=minishop-production \
            -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $DEPLOY_COMMIT" \
            < scripts/deploy-production.sh
